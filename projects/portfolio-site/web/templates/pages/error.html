{{ define "content" }}

    <div class="container">
        <p class="eyebrow">Error</p>
        <h1 style="font-size:clamp(64px,12vw,120px)">{{ .StatusCode }}</h1>
        <p class="hero-text" style="max-width:480px">{{ .Description }}</p>
        <div class="hero-actions" style="margin-top:24px">

        </div>
    </div>
</section>
