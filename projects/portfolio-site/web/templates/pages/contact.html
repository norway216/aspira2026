{{ define "content" }}
<section class="page-hero">
    <p class="eyebrow">Contact</p>
    <h1>Get in touch.</h1>
    <p class="page-description">
        I'm open to collaboration, consulting, and full-time opportunities in embedded systems, medical imaging, and backend engineering.
    </p>
</section>

<section class="section" style="max-width:600px">
    {{ if .Success }}
    <div class="message message-success">{{ .Success }}</div>
    {{ end }}
    {{ if .Error }}
    <div class="message message-error">{{ .Error }}</div>
    {{ end }}

    <form method="POST" action="/contact" class="contact-form">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
</section>
{{ end }}
