    <rect width="360" height="55" rx="16" fill="url(#g3)"/>
    <text x="180" y="35" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="17" font-weight="800">Secure Traffic Gateway</text>
    <text x="16" y="78" fill="#98989D" font-size="11">Backend Systems</text>
    <text x="16" y="98" fill="#98989D" font-size="10">Go, TLS, Docker, Kubernetes, Prometheus, Grafana</text>
    <text x="340" y="115" text-anchor="end" fill="#007AFF" font-size="12" font-weight="600">Read Architecture →</text>
  </g>

  <!-- Project Cards Row 2 -->
  <g transform="translate(40, 380)">
    <rect width="360" height="130" rx="16" fill="#1C1C1E" stroke="rgba(255,255,255,0.06)"/>
    <rect width="360" height="55" rx="16" fill="url(#g4)"/>
    <text x="180" y="35" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="17" font-weight="800">Face Detection &amp; Recognition</text>
    <text x="16" y="78" fill="#98989D" font-size="11">Medical Imaging</text>
    <text x="16" y="98" fill="#98989D" font-size="10">C++20, OpenCV, dlib, Qt/QML, ONNX Runtime</text>
    <text x="340" y="115" text-anchor="end" fill="#007AFF" font-size="12" font-weight="600">Read Architecture →</text>
  </g>

  <g transform="translate(420, 380)">
    <rect width="360" height="130" rx="16" fill="#1C1C1E" stroke="rgba(255,255,255,0.06)"/>
    <rect width="360" height="55" rx="16" fill="url(#g5)"/>
    <text x="180" y="35" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="17" font-weight="800">Hardware Wallet</text>
    <text x="16" y="78" fill="#98989D" font-size="11">Security</text>
    <text x="16" y="98" fill="#98989D" font-size="10">C++20, Qt/QML, SQLite, OpenSSL, spdlog</text>
    <text x="340" y="115" text-anchor="end" fill="#007AFF" font-size="12" font-weight="600">Read Architecture →</text>
  </g>

  <g transform="translate(800, 380)">
    <rect width="360" height="130" rx="16" fill="#1C1C1E" stroke="rgba(255,255,255,0.06)"/>
    <rect width="360" height="55" rx="16" fill="url(#g6)"/>
    <text x="180" y="35" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="17" font-weight="800">LAN Device Management</text>
    <text x="16" y="78" fill="#98989D" font-size="11">Backend Systems</text>
    <text x="16" y="98" fill="#98989D" font-size="10">Go, WebSocket, SQLite, Redis, Docker, Prometheus</text>
    <text x="340" y="115" text-anchor="end" fill="#007AFF" font-size="12" font-weight="600">Read Architecture →</text>
  </g>

  <!-- Footer -->
  <text x="600" y="585" text-anchor="middle" fill="#98989D" font-size="12">© 2026 Aspira Studio. Built with Go &amp; intent.</text>
