  <rect width="1200" height="600" fill="#000000"/>

  <!-- Header -->
  <rect width="1200" height="56" fill="rgba(0,0,0,0.72)"/>
  <line y1="56" x1="0" y2="56" x2="1200" stroke="rgba(255,255,255,0.08)"/>
  <text x="32" y="36" fill="#F5F5F7" font-size="16" font-weight="700">◆ Aspira Studio</text>
  <text x="750" y="36" fill="#F5F5F7" font-size="13" font-weight="500">Projects</text>

  <!-- Page title -->
  <text x="600" y="120" text-anchor="middle" fill="#98989D" font-size="13" font-weight="600" letter-spacing="0.16">PROJECTS</text>
  <text x="600" y="165" text-anchor="middle" fill="url(#heroText)" font-size="36" font-weight="800" letter-spacing="-0.04">Engineering architecture &amp; system design.</text>
  <text x="600" y="200" text-anchor="middle" fill="#98989D" font-size="15">In-depth architecture documents covering embedded Linux, medical imaging, backend systems, and C++ engineering.</text>

  <!-- Project Cards Row 1 -->
  <g transform="translate(40, 230)">
    <rect width="360" height="130" rx="16" fill="#1C1C1E" stroke="rgba(255,255,255,0.06)"/>
    <rect width="360" height="55" rx="16" fill="url(#g1)"/>
    <text x="180" y="35" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="17" font-weight="800">Iris Recognition System</text>
    <text x="16" y="78" fill="#98989D" font-size="11">Medical Imaging</text>
    <text x="16" y="98" fill="#98989D" font-size="10">C++, OpenCV, ONNX Runtime, FFmpeg, Android</text>
    <text x="340" y="115" text-anchor="end" fill="#007AFF" font-size="12" font-weight="600">Read Architecture →</text>
  </g>

  <g transform="translate(420, 230)">
    <rect width="360" height="130" rx="16" fill="#1C1C1E" stroke="rgba(255,255,255,0.06)"/>
    <rect width="360" height="55" rx="16" fill="url(#g2)"/>
    <text x="180" y="35" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="17" font-weight="800">Embedded Device Ops Platform</text>
    <text x="16" y="78" fill="#98989D" font-size="11">Embedded Linux</text>
    <text x="16" y="98" fill="#98989D" font-size="10">Go, WebSocket, gRPC, Prometheus, Grafana, RK3588</text>
    <text x="340" y="115" text-anchor="end" fill="#007AFF" font-size="12" font-weight="600">Read Architecture →</text>
  </g>

  <g transform="translate(800, 230)">
