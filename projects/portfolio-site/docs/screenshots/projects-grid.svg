<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="heroText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2D55"/>
      <stop offset="30%" style="stop-color:#AF52DE"/>
      <stop offset="60%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#007AFF"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FF2D55"/><stop offset="100%" style="stop-color:#FF8E9E"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#5E1F8A"/><stop offset="100%" style="stop-color:#CA7AF0"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#007D4C"/><stop offset="100%" style="stop-color:#6EE7A8"/></linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#E85D04"/><stop offset="100%" style="stop-color:#FFC043"/></linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0038A8"/><stop offset="100%" style="stop-color:#64D2FF"/></linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#C41E70"/><stop offset="100%" style="stop-color:#FF6B8A"/></linearGradient>
