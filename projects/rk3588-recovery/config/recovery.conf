# RK3588 Recovery System Configuration
# Partition layout for RK3588 platform

[partitions]
boot      /dev/mmcblk0p1  /mnt/boot      fat32  67108864
system    /dev/mmcblk0p2  /mnt/system    ext4   17179869184
recovery  /dev/mmcblk0p3  /mnt/recovery  ext4    536870912
userdata  /dev/mmcblk0p4  /mnt/userdata  ext4   34359738368

[recovery]
# Power key GPIO config
gpio_pin = 17
long_press_ms = 3000

# Backup storage
backup_dir = /userdata/backup

# Logging
log_path = /var/log/rk3588_recovery.log
max_log_entries = 10000

[security]
# Verification
verify_checksum = true
checksum_type = sha256
