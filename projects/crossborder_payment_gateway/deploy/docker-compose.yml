version: "3.8"

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GIN_MODE=release
    volumes:
      - gateway_data:/app/data
    networks:
      - payment_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/api/v1/auth/login", "-T", "5"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: paygw
      POSTGRES_PASSWORD: paygw_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    networks:
      - payment_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygw -d payment_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - payment_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  gateway_data:
  pgdata:

networks:
  payment_net:
    driver: bridge
