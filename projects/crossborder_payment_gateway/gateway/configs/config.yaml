server:
  port: 8080
  mode: debug
  read_timeout: 30s
  write_timeout: 30s

database:
  driver: sqlite
  dsn: data/payment_gateway.db

engine:
  addr: localhost:9100
  enabled: false
  timeout: 5s

auth:
  jwt_secret: change-me-in-production-please
  token_expiry: 24h
  refresh_expiry: 168h

redis:
  addr: localhost:6379
  password: ""
  db: 0

exchange:
  api_url: "https://open.er-api.com/v6/latest/USD"
  refresh_interval: 1h
  enabled: true
