<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="pg1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF2D55"/>
      <stop offset="0.5" stop-color="#AF52DE"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="pg2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30D158"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circles -->
  <circle cx="320" cy="60" r="100" fill="url(#pg1)" opacity="0.08"/>
  <circle cx="80" cy="240" r="120" fill="url(#pg2)" opacity="0.06"/>
  <!-- Card -->
  <rect x="80" y="60" width="240" height="150" rx="16" fill="url(#pg1)" filter="url(#glow)"/>
  <rect x="80" y="60" width="240" height="150" rx="16" fill="white" fill-opacity="0.1"/>
  <circle cx="120" cy="100" r="16" fill="white" fill-opacity="0.3"/>
  <circle cx="148" cy="100" r="16" fill="white" fill-opacity="0.2"/>
  <text x="120" y="155" fill="white" font-family="monospace" font-size="14" font-weight="600" opacity="0.8">•••• •••• •••• 4242</text>
  <text x="120" y="180" fill="white" font-family="sans-serif" font-size="11" opacity="0.6">CARD HOLDER</text>
  <!-- Arrow -->
  <path d="M200 230L260 230" stroke="url(#pg1)" stroke-width="3" stroke-dasharray="8 4" opacity="0.6"/>
  <path d="M252 224L260 230L252 236" stroke="url(#pg1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Globe -->
  <circle cx="310" cy="230" r="30" stroke="url(#pg1)" stroke-width="2" opacity="0.4"/>
  <ellipse cx="310" cy="230" rx="15" ry="30" stroke="url(#pg1)" stroke-width="1.5" opacity="0.3"/>
  <line x1="280" y1="230" x2="340" y2="230" stroke="url(#pg1)" stroke-width="1.5" opacity="0.3"/>
</svg>
