<?xml version="1.0" encoding="UTF-8"?>
<svg width="510" height="160" viewBox="0 0 510 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Icon gradient: top-left(pink) → bottom-right(blue) = CSS 135deg -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="50%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <!-- Text gradient: left(pink) → right(blue) across the text -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="33%" stop-color="#AF52DE"/>
      <stop offset="66%" stop-color="#5856D6"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
  </defs>

  <!-- Icon: 120x120 -->
  <g transform="translate(20,20)">
    <rect width="120" height="120" rx="34" fill="url(#iconGrad)"/>
    <path d="M34 60L51 77L86 43" stroke="white" stroke-width="10.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: positioned to align with icon -->
  <text x="164" y="94" font-family="'DejaVu Sans', 'Nimbus Sans', 'Helvetica Neue', 'Segoe UI', sans-serif"
        font-size="58" font-weight="800" letter-spacing="-0.02em" fill="url(#textGrad)"
        dominant-baseline="central">Aspira Pay</text>
</svg>
